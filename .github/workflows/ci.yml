# Integração contínua: typecheck, build, testes unitários, E2E e testes da API.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend (build + testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Dependências da API (servidor de teste dos E2E)
        run: pip install -r ../api/requirements.txt
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium
      - name: Testes E2E
        run: npm run e2e
      - name: Relatório/screenshots dos E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: apps/web/e2e/.results
          if-no-files-found: ignore
      - name: Bundle de produção (dist)
        uses: actions/upload-artifact@v4
        with:
          name: agentslab-web-dist
          path: apps/web/dist

  api:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
